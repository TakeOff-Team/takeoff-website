<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Takeoff — Get back 5+ hours every week, for free.</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Geist", system-ui, -apple-system, sans-serif;
    background: #FFFFFF;
    color: #0A0A0A;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: #A6F23F; color: #0A0A0A; }
  button { font: inherit; }
  a { color: inherit; }

  @media (max-width: 760px) {
    .grid-2 { grid-template-columns: 1fr !important; }
    .proof-grid { grid-template-columns: 1fr !important; gap: 64px !important; }
    .proof-stack {
      min-height: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 24px !important;
      padding: 24px 0 !important;
    }
    .proof-stack > .proof-text-1,
    .proof-stack > .proof-text-2 {
      position: static !important;
      width: 88% !important;
    }
    .proof-text-1 { align-self: flex-start; }
    .proof-text-2 { align-self: flex-end; }

    /* Tighten side padding on small screens across all sections */
    section, footer { padding-left: 24px !important; padding-right: 24px !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
